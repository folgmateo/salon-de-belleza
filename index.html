<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f0b0a">
  <meta name="description" content="Salón de Belleza: cortes, color, maquillaje, manicura, tratamientos faciales y peinados. Agenda tu cita en línea.">
  <title>Salón de Belleza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#top">Salón de Belleza</a>
  <div class="top-actions">
    <a class="tel" href="tel:+50254870255">+502 5487 0255</a>
    <a class="btn btn-gold" href="#agenda">Agendar cita</a>
  </div>
</header>

<main id="top">
  <section class="hero-stage" id="stage">
    <div class="sticky">
      <div class="scene" id="scene">
        <div class="box" id="box">
          <div class="face front"><span class="box-name">Salón de Belleza</span></div>
          <div class="face back"></div>
          <div class="face right"></div>
          <div class="face left"></div>
          <div class="face top"></div>
          <div class="face bottom"></div>
        </div>
        <div class="items" id="items"></div>
      </div>

      <div class="caption" id="caption">
        <span class="num"></span>
        <h2></h2>
        <p>Desliza para descubrir lo que hacemos.</p>
      </div>

      <a class="skip btn btn-ghost" href="#agenda">Saltar animación y agendar cita ↓</a>
      <div class="progress"><span id="bar"></span></div>
    </div>
  </section>

  <section class="agenda" id="agenda" tabindex="-1">
    <p class="kicker">Reserva en línea</p>
    <h2 class="agenda-title">Tu cita, en nuestro cuaderno</h2>

    <div class="notebook">
      <div class="rings" aria-hidden="true"></div>

      <div class="page page-left">
        <div class="cal-head">
          <button type="button" class="nav" id="prev" aria-label="Mes anterior">‹</button>
          <span id="month"></span>
          <button type="button" class="nav" id="next" aria-label="Mes siguiente">›</button>
        </div>
        <div class="cal-grid" id="grid"></div>
        <p class="label">Horario</p>
        <div class="slots" id="slots"></div>
      </div>

      <div class="page page-right">
        <form id="form" novalidate>
          <label>Nombre completo
            <input name="nombre" required autocomplete="name" maxlength="80">
          </label>
          <label>Teléfono
            <input name="telefono" type="tel" required autocomplete="tel" pattern="[+0-9 ]{8,16}" placeholder="+502 0000 0000">
          </label>
          <label>Correo electrónico (recibirás el recordatorio aquí)
            <input name="email" type="email" required autocomplete="email" maxlength="120">
          </label>
          <label>Servicio
            <select name="servicio" required>
              <option>Corte y estilo</option>
              <option>Color y mechas</option>
              <option>Maquillaje</option>
              <option>Manicura y pedicura</option>
              <option>Tratamientos faciales</option>
              <option>Peinados para ocasiones</option>
            </select>
          </label>
          <label>Notas (opcional)
            <textarea name="notas" rows="2" maxlength="300"></textarea>
          </label>
          <p class="msg" id="msg" role="status"></p>
          <button class="btn btn-gold btn-block" type="submit">Confirmar cita</button>
        </form>
        <div class="ok" id="ok" hidden></div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <span>Salón de Belleza</span>
  <a href="tel:+50254870255">Tel. +502 5487 0255</a>
</footer>

<script src="script.js"></script>
</body>
</html>
